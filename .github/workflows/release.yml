name: Release

# Nobody writes a version number and nobody cuts a release by hand. On every push to
# main, release-please reads the commits since the last release (each one the title of
# a squash-merged pull request) and opens or updates "chore(main): release X.Y.Z" with the
# next version in every file of release-please-config.json and the new section of
# CHANGELOG.md. This workflow merges that pull request at once and runs release-please again,
# which creates the tag and the GitHub Release.
# feat: raises the minor number, fix:, perf: and revert: the patch one, and a ! after the type the major one; docs, test, ci, chore, refactor, build and style release nothing.
#
# Everything runs with RELEASE_TOKEN, a fine-grained token of a repository admin (Contents
# and Pull requests: read and write). With the default token the release pull request is
# opened by a bot whose checks wait for approval and which cannot merge past the ruleset; the
# admin token opens it like a person does and merges it with --admin, which the ruleset lets
# admins do. token-check.yml warns before it expires.
# Managed by Nabu (https://github.com/ilien-dev/nabu); do not edit by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.publish.outputs.release_created }}
      tag: ${{ steps.publish.outputs.tag_name }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Open or update the release pull request
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Merge the release pull request
        id: merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr list --repo "$REPO" --state open --label "autorelease: pending" --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "Nothing to release."
            exit 0
          fi
          gh pr merge "$pr" --repo "$REPO" --squash --admin --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Publish the tag and the GitHub Release
        id: publish
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
