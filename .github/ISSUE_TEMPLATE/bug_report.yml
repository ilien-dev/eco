name: Bug report
description: Something in Eco does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. Search the [existing issues](https://github.com/ilien-dev/eco/issues?q=is%3Aissue) first.
        Never paste a Search Console export, a Chrome UX Report key, a GitHub token or private data from your `.eco/` folder.
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - eco-readme
        - eco-site
        - eco.py on its own
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The prompt or the eco.py command, and the steps that lead to the problem.
      placeholder: "1. /eco-site on my site\n2. ...\n3. eco.py --mode site audit"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The eco.py output or the agent's message, word for word, and a screenshot of the report if it helps.
    validations:
      required: true
  - type: input
    id: eco
    attributes:
      label: Eco version
      description: The "version" in .claude-plugin/plugin.json of your install.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: "Claude Code 2.x with Opus, Codex, ..."
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Python version and operating system
      placeholder: "Python 3.12, Windows 11"
  - type: checkboxes
    id: searched
    attributes:
      label: Before opening
      options:
        - label: I searched the existing issues and this one is not reported yet.
          required: true
