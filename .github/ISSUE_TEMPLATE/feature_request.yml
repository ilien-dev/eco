name: Feature request
description: Propose one improvement to Eco.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        One idea per issue. Eco finds the words people search for and puts them where search engines read them, in your own README or website, and proves each step with a script. Ideas outside that purpose will be declined.
        Search the [issues](https://github.com/ilien-dev/eco/issues?q=is%3Aissue) and [pull requests](https://github.com/ilien-dev/eco/pulls?q=is%3Apr) first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: How it would be measured
      description: The number that should move, and how to read it before and after.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before opening
      options:
        - label: I searched the existing issues and pull requests and nobody proposed this yet.
          required: true
        - label: This is a single idea, not several in one issue.
          required: true
        - label: I would like to send the pull request myself.
