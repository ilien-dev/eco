<!--palette
bg        #151515 #F4F4F2
ink       #F4F4F2 #151515
body      #D9DAD4 #33342F
muted     #A9AAA3 #5E5F58
panel     #1F201E #FFFFFF
line      #33342F #D9DAD4
ring      #262724 #E4E5E0
card2     #1A1B19 #ECECE8
lime      #C4F03A #C4F03A
on_accent #151515 #151515
accent    #C4F03A #4A6600
tile      #151515 #C4F03A
mark      #C4F03A #151515
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" role="img" aria-label="Two stories take turns. The search github readme banner is matched word by word against a README title: the old title lacks banner and gets a cross, the new one has all three words and gets a tick. Then the search web scraping mcp server is matched against a web page title: the old title has only web and gets a cross, the new one has all four words and gets a tick.">
<style>
/* 24 s loop: the README story (A) in the first 12 s, the web page story (B) in the second.
   Each story keeps its 12 s timing and runs inside halfA / halfB.
   12 s story
   scan before  |--scan--|
   found words        |lit|....off  |lit=================|
   x before                |in|===========================|out
   scan after                    |--scan--|
   missing words                          |lit============|
   tick after                                |in|=========|out
   no delays: each part has its own keyframes; each half slides 10 px as it swaps */
@keyframes ripple{0%{transform:scale(.01);opacity:0}5%{opacity:1}88%{opacity:1}100%{transform:scale(1);opacity:0}}
.ew{fill:none;stroke:$ring;stroke-width:2;animation:ripple 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes halfA{0%,48.5%{opacity:1}49.5%,99%{opacity:0}100%{opacity:1}}
.halfA{animation:halfA 24s linear infinite}
@keyframes halfB{0%,49%{opacity:0}50%,98.5%{opacity:1}99.5%,100%{opacity:0}}
.halfB{animation:halfB 24s linear infinite}
@keyframes slideA{0%,48.5%{transform:translateY(0)}49.5%,99%{transform:translateY(10px)}100%{transform:translateY(0)}}
.slideA{animation:slideA 24s cubic-bezier(.4,0,.2,1) infinite}
@keyframes slideB{0%,49%{transform:translateY(10px)}50%,98.5%{transform:translateY(0)}99.5%,100%{transform:translateY(10px)}}
.slideB{animation:slideB 24s cubic-bezier(.4,0,.2,1) infinite}
@keyframes uAb{0%,4%{transform:scaleX(0);opacity:0}5%{transform:scaleX(.02);opacity:1}22%{transform:scaleX(1);opacity:1}26%,100%{transform:scaleX(1);opacity:0}}
.uAb{animation:uAb 12s cubic-bezier(.45,0,.55,1) infinite;transform-box:fill-box;transform-origin:left center}
@keyframes duAb{0%,4%{transform:translateX(0);opacity:0}5%{transform:translateX(10px);opacity:1}22%{transform:translateX(507px);opacity:1}26%,100%{transform:translateX(507px);opacity:0}}
.duAb{animation:duAb 12s cubic-bezier(.45,0,.55,1) infinite}
@keyframes uAa{0%,44%{transform:scaleX(0);opacity:0}45%{transform:scaleX(.02);opacity:1}62%{transform:scaleX(1);opacity:1}66%,100%{transform:scaleX(1);opacity:0}}
.uAa{animation:uAa 12s cubic-bezier(.45,0,.55,1) infinite;transform-box:fill-box;transform-origin:left center}
@keyframes duAa{0%,44%{transform:translateX(0);opacity:0}45%{transform:translateX(10px);opacity:1}62%{transform:translateX(634px);opacity:1}66%,100%{transform:translateX(634px);opacity:0}}
.duAa{animation:duAa 12s cubic-bezier(.45,0,.55,1) infinite}
@keyframes uBb{0%,4%{transform:scaleX(0);opacity:0}5%{transform:scaleX(.02);opacity:1}22%{transform:scaleX(1);opacity:1}26%,100%{transform:scaleX(1);opacity:0}}
.uBb{animation:uBb 12s cubic-bezier(.45,0,.55,1) infinite;transform-box:fill-box;transform-origin:left center}
@keyframes duBb{0%,4%{transform:translateX(0);opacity:0}5%{transform:translateX(10px);opacity:1}22%{transform:translateX(496px);opacity:1}26%,100%{transform:translateX(496px);opacity:0}}
.duBb{animation:duBb 12s cubic-bezier(.45,0,.55,1) infinite}
@keyframes uBa{0%,44%{transform:scaleX(0);opacity:0}45%{transform:scaleX(.02);opacity:1}62%{transform:scaleX(1);opacity:1}66%,100%{transform:scaleX(1);opacity:0}}
.uBa{animation:uBa 12s cubic-bezier(.45,0,.55,1) infinite;transform-box:fill-box;transform-origin:left center}
@keyframes duBa{0%,44%{transform:translateX(0);opacity:0}45%{transform:translateX(10px);opacity:1}62%{transform:translateX(529px);opacity:1}66%,100%{transform:translateX(529px);opacity:0}}
.duBa{animation:duBa 12s cubic-bezier(.45,0,.55,1) infinite}
@keyframes twice0{0%,10%{opacity:0}13%,38%{opacity:1}42%,52%{opacity:0}55%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes twice1{0%,13%{opacity:0}16%,38%{opacity:1}42%,52%{opacity:0}58%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes once0{0%,60%{opacity:0}63%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes once1{0%,61.5%{opacity:0}64.5%,95%{opacity:1}98%,100%{opacity:0}}
@keyframes once2{0%,63%{opacity:0}66%,95%{opacity:1}98%,100%{opacity:0}}
.twice0{animation:twice0 12s ease-in-out infinite}
.twice1{animation:twice1 12s ease-in-out infinite}
.once0{animation:once0 12s ease-in-out infinite}
.once1{animation:once1 12s ease-in-out infinite}
.once2{animation:once2 12s ease-in-out infinite}
@keyframes noA{0%,25%{opacity:0;transform:scale(.6)}28%,95%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(1)}}
@keyframes yesB{0%,65%{opacity:0;transform:scale(.6)}68%,95%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(1)}}
.noA{animation:noA 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
.yesB{animation:yesB 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{animation:flow 1.2s linear infinite}
</style>
<rect width="1280" height="448" fill="$bg"/>
<g id="backdrop" data-backdrop="custom rise"><g transform="translate(640 600)"><circle class="ew" style="animation-delay:-0s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-2s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-4s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-6s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-8s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-10s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-12s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-14s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-16s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-18s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-20s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-22s" r="897" vector-effect="non-scaling-stroke"/></g></g>
<text id="eyebrow" x="64" y="56" class="m" font-size="15" letter-spacing="2" fill="$accent">WHY NOBODY FINDS YOU</text>
<text id="title" x="64" y="108" class="b" font-size="40" fill="$ink">Search engines match the words people type</text>
<text id="sub" x="64" y="146" class="s" font-size="20" fill="$body">A title that leaves out a searched word gets left out.</text>
<g id="stage">
<!-- what people type -->
<rect x="48" y="180" width="352" height="248" rx="18" fill="$card2"/>
<rect x="64" y="196" width="320" height="48" rx="24" fill="$panel" stroke="$line" stroke-width="1.5"/>
<g transform="translate(78 204)" data-asset="ph:magnifying-glass-fill" data-icon="search"><g transform="scale(0.125)" color="$muted"><path fill="$muted" d="M168 112a56 56 0 1 1-56-56a56 56 0 0 1 56 56m61.66 117.66a8 8 0 0 1-11.32 0l-50.06-50.07a88 88 0 1 1 11.32-11.31l50.06 50.06a8 8 0 0 1 0 11.32M112 184a72 72 0 1 0-72-72a72.08 72.08 0 0 0 72 72"/></g></g>
<!-- A: the README story, three words -->
<g class="halfA"><g class="slideA">
<text x="120" y="226" class="m" font-size="16" fill="$ink">github readme banner</text>
<rect x="72" y="284" width="148" height="40" rx="10" fill="$panel" stroke="$line" stroke-width="1.5"/>
<text x="146" y="310" class="m" font-size="16" fill="$ink" text-anchor="middle">github</text>
<g class="twice0"><rect x="72" y="284" width="148" height="39.6" rx="10" fill="$lime"/><text x="146" y="310" class="m" font-size="16" fill="$on_accent" text-anchor="middle">github</text></g>
<rect x="228" y="284" width="148" height="40" rx="10" fill="$panel" stroke="$line" stroke-width="1.5"/>
<text x="302" y="310" class="m" font-size="16" fill="$ink" text-anchor="middle">readme</text>
<g class="twice1"><rect x="228" y="284" width="148" height="39.6" rx="10" fill="$lime"/><text x="302" y="310" class="m" font-size="16" fill="$on_accent" text-anchor="middle">readme</text></g>
<rect x="72" y="344" width="148" height="40" rx="10" fill="$panel" stroke="$line" stroke-width="1.5"/>
<text x="146" y="370" class="m" font-size="16" fill="$ink" text-anchor="middle">banner</text>
<g class="once0"><rect x="72" y="344" width="148" height="39.6" rx="10" fill="$lime"/><text x="146" y="370" class="m" font-size="16" fill="$on_accent" text-anchor="middle">banner</text></g>
</g></g>
<!-- B: the web page story, four words -->
<g class="halfB" opacity="0"><g class="slideB">
<text x="120" y="226" class="m" font-size="16" fill="$ink">web scraping mcp server</text>
<rect x="72" y="284" width="148" height="40" rx="10" fill="$panel" stroke="$line" stroke-width="1.5"/>
<text x="146" y="310" class="m" font-size="16" fill="$ink" text-anchor="middle">web</text>
<g class="twice0"><rect x="72" y="284" width="148" height="39.6" rx="10" fill="$lime"/><text x="146" y="310" class="m" font-size="16" fill="$on_accent" text-anchor="middle">web</text></g>
<rect x="228" y="284" width="148" height="40" rx="10" fill="$panel" stroke="$line" stroke-width="1.5"/>
<text x="302" y="310" class="m" font-size="16" fill="$ink" text-anchor="middle">scraping</text>
<g class="once0"><rect x="228" y="284" width="148" height="39.6" rx="10" fill="$lime"/><text x="302" y="310" class="m" font-size="16" fill="$on_accent" text-anchor="middle">scraping</text></g>
<rect x="72" y="344" width="148" height="40" rx="10" fill="$panel" stroke="$line" stroke-width="1.5"/>
<text x="146" y="370" class="m" font-size="16" fill="$ink" text-anchor="middle">mcp</text>
<g class="once1"><rect x="72" y="344" width="148" height="39.6" rx="10" fill="$lime"/><text x="146" y="370" class="m" font-size="16" fill="$on_accent" text-anchor="middle">mcp</text></g>
<rect x="228" y="344" width="148" height="40" rx="10" fill="$panel" stroke="$line" stroke-width="1.5"/>
<text x="302" y="370" class="m" font-size="16" fill="$ink" text-anchor="middle">server</text>
<g class="once2"><rect x="228" y="344" width="148" height="39.6" rx="10" fill="$lime"/><text x="302" y="370" class="m" font-size="16" fill="$on_accent" text-anchor="middle">server</text></g>
</g></g>
<!-- the query goes to the titles -->
<path class="flow" d="M408 340H436" fill="none" stroke="$muted" stroke-width="2" stroke-dasharray="8 16"/>
<path d="M432 332l10 8-10 8" fill="none" stroke="$muted" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<!-- the title before -->
<rect x="464" y="196" width="752" height="100" rx="14" fill="$panel" stroke="$line" stroke-width="1.5"/>
<!-- the title after -->
<rect x="464" y="316" width="752" height="100" rx="14" fill="$panel" stroke="$line" stroke-width="1.5"/>
<g class="halfA"><g class="slideA">
<text x="488" y="228" class="m" font-size="14" fill="$muted">README title · before</text>
<text x="488" y="266" class="s" font-size="20" fill="$body">Jano: an animated SVG hero for your <tspan fill="$accent">GitHub README</tspan></text>
<g class="noA"><g transform="translate(1136 222)" data-asset="ph:x-circle-fill" data-icon="not found"><g transform="scale(0.1875)" color="$muted"><path fill="$muted" d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m37.66 130.34a8 8 0 0 1-11.32 11.32L128 139.31l-26.34 26.35a8 8 0 0 1-11.32-11.32L116.69 128l-26.35-26.34a8 8 0 0 1 11.32-11.32L128 116.69l26.34-26.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></g></g>
<g class="noA"><text x="1116" y="228" class="m" font-size="15" fill="$ink" text-anchor="end">2 of 3 words: no "banner"</text></g>
<text x="488" y="348" class="m" font-size="14" fill="$muted">README title · after</text>
<text x="488" y="386" class="s" font-size="20" fill="$body">Jano: an animated <tspan fill="$accent">GitHub README banner</tspan>, drawn for your project</text>
<g class="yesB"><g transform="translate(1136 342)" data-asset="ph:check-circle-fill" data-icon="found"><g transform="scale(0.1875)" color="$accent"><path fill="$accent" d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m45.66 85.66l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 11.32"/></g></g></g>
<g class="yesB"><text x="1116" y="348" class="m" font-size="15" fill="$accent" text-anchor="end">3 of 3 words</text></g>
</g></g>
<g class="halfB" opacity="0"><g class="slideB">
<text x="488" y="228" class="m" font-size="14" fill="$muted">page title · before</text>
<text x="488" y="266" class="s" font-size="20" fill="$body">Svipall: your agent doesn't read the <tspan fill="$accent">web</tspan>. It tries to.</text>
<g class="noA"><g transform="translate(1136 222)" data-asset="ph:x-circle-fill" data-icon="not found"><g transform="scale(0.1875)" color="$muted"><path fill="$muted" d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m37.66 130.34a8 8 0 0 1-11.32 11.32L128 139.31l-26.34 26.35a8 8 0 0 1-11.32-11.32L116.69 128l-26.35-26.34a8 8 0 0 1 11.32-11.32L128 116.69l26.34-26.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></g></g></g>
<g class="noA"><text x="1116" y="228" class="m" font-size="15" fill="$ink" text-anchor="end">1 of 4 words</text></g>
<text x="488" y="348" class="m" font-size="14" fill="$muted">page title · after</text>
<text x="488" y="386" class="s" font-size="20" fill="$body">Svipall: local <tspan fill="$accent">web scraping MCP server</tspan> with web search</text>
<g class="yesB"><g transform="translate(1136 342)" data-asset="ph:check-circle-fill" data-icon="found"><g transform="scale(0.1875)" color="$accent"><path fill="$accent" d="M128 24a104 104 0 1 0 104 104A104.11 104.11 0 0 0 128 24m45.66 85.66l-56 56a8 8 0 0 1-11.32 0l-24-24a8 8 0 0 1 11.32-11.32L112 148.69l50.34-50.35a8 8 0 0 1 11.32 11.32"/></g></g></g>
<g class="yesB"><text x="1116" y="348" class="m" font-size="15" fill="$accent" text-anchor="end">4 of 4 words</text></g>
</g></g>
<!-- an underline reads each title -->
<g class="halfA"><rect class="uAb" opacity="0" x="488" y="274" width="507" height="4" rx="2" fill="$accent"/><g transform="translate(488 278)"><circle class="duAb" opacity="0" r="13" fill="$accent" fill-opacity=".3" stroke="$accent" stroke-width="2"/></g><rect class="uAa" opacity="0" x="488" y="394" width="634" height="4" rx="2" fill="$accent"/><g transform="translate(488 398)"><circle class="duAa" opacity="0" r="13" fill="$accent" fill-opacity=".3" stroke="$accent" stroke-width="2"/></g></g>
<g class="halfB" opacity="0"><rect class="uBb" opacity="0" x="488" y="274" width="496" height="4" rx="2" fill="$accent"/><g transform="translate(488 278)"><circle class="duBb" opacity="0" r="13" fill="$accent" fill-opacity=".3" stroke="$accent" stroke-width="2"/></g><rect class="uBa" opacity="0" x="488" y="394" width="529" height="4" rx="2" fill="$accent"/><g transform="translate(488 398)"><circle class="duBa" opacity="0" r="13" fill="$accent" fill-opacity=".3" stroke="$accent" stroke-width="2"/></g></g>
</g>
</svg>
