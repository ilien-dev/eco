<g class="ring2" opacity="0"><rect x="80" y="296" width="324" height="30" rx="9"/><rect x="80" y="356" width="284" height="30" rx="9"/></g>
<g data-rest="shown"><g class="ring3"><rect x="608" y="356" width="240" height="42" rx="10"/></g></g>
</g>
</g></g>
<!-- from the page to the card -->
<path class="flow" d="M884 306H906" fill="none" stroke="$muted" stroke-width="2" stroke-dasharray="8 16"/>
<!-- the card that names it -->
<rect x="912" y="176" width="304" height="256" rx="14" fill="$panel" stroke="$line" stroke-width="1.5"/>
<text x="936" y="210" class="m" font-size="14" fill="$muted">place · phrase</text>
<g clip-path="url(#cardclip)">
<g class="halfA">
<g class="turn0" opacity="0"><text x="936" y="276" class="b" font-size="24" fill="$ink">Title</text><rect x="936" y="296" width="220" height="38" rx="8" fill="$lime"/><text x="1046" y="321" class="b" font-size="16" fill="$on_accent" text-anchor="middle">github readme banner</text></g>
<g class="turn1" opacity="0"><text x="936" y="276" class="b" font-size="24" fill="$ink">First lines</text><rect x="936" y="296" width="220" height="38" rx="8" fill="$lime"/><text x="1046" y="321" class="b" font-size="16" fill="$on_accent" text-anchor="middle">readme header</text></g>
<g class="turn2" opacity="0"><text x="936" y="276" class="b" font-size="24" fill="$ink">Image alt text</text><rect x="936" y="296" width="220" height="38" rx="8" fill="$lime"/><text x="1046" y="321" class="b" font-size="16" fill="$on_accent" text-anchor="middle">github readme banner</text></g>
<g data-rest="shown"><g class="turn3"><text x="936" y="276" class="b" font-size="24" fill="$ink">Topics</text><rect x="936" y="296" width="220" height="38" rx="8" fill="$lime"/><text x="1046" y="321" class="b" font-size="16" fill="$on_accent" text-anchor="middle">github-readme-banner</text></g></g>
</g>
<g class="halfB" opacity="0">
<g class="turn0" opacity="0"><text x="936" y="276" class="b" font-size="24" fill="$ink">Page title</text><rect x="936" y="296" width="248" height="38" rx="8" fill="$lime"/><text x="1060" y="321" class="b" font-size="16" fill="$on_accent" text-anchor="middle">web scraping mcp server</text></g>
<g class="turn1" opacity="0"><text x="936" y="276" class="b" font-size="24" fill="$ink">Meta description</text><rect x="936" y="296" width="248" height="38" rx="8" fill="$lime"/><text x="1060" y="321" class="b" font-size="16" fill="$on_accent" text-anchor="middle">web scraping mcp server</text></g>
