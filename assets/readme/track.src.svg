<!--palette
bg        #151515 #F4F4F2
ink       #F4F4F2 #151515
body      #D9DAD4 #33342F
muted     #A9AAA3 #5E5F58
panel     #1F201E #FFFFFF
line      #33342F #D9DAD4
ring      #262724 #E4E5E0
lime      #C4F03A #C4F03A
on_accent #151515 #151515
accent    #C4F03A #4A6600
tile      #151515 #C4F03A
mark      #C4F03A #151515
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" role="img" aria-label="A report ticks every placement of the phrases, the changes are published, and later the track command repeats the saved searches: each search gets a verdict, improved, no change, worse or too early to tell.">
<style>
/* 12 s story
   ticks      |1|2|3|4|=====================================|out
   parcel A              |->|
   globe                    |pulse|
   parcel B                        |->|
   typing                              |type|=============|back
   verdicts   take turns every 3 s in each row */
@keyframes ripple{0%{transform:scale(.01);opacity:0}5%{opacity:1}88%{opacity:1}100%{transform:scale(1);opacity:0}}
.ew{fill:none;stroke:$ring;stroke-width:2;animation:ripple 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes tick{0%,2%{opacity:0;transform:scale(.6)}5%,92%{opacity:1;transform:scale(1)}95%,100%{opacity:0;transform:scale(1)}}
.tick{animation:tick 12s cubic-bezier(0,0,.2,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes hopA{0%,25%{opacity:0;transform:translateX(0)}27%{opacity:1;transform:translateX(0)}35%{opacity:1;transform:translateX(96px)}38%,100%{opacity:0;transform:translateX(96px)}}
@keyframes hopB{0%,43%{opacity:0;transform:translateX(0)}45%{opacity:1;transform:translateX(0)}53%{opacity:1;transform:translateX(96px)}56%,100%{opacity:0;transform:translateX(96px)}}
.hopA{animation:hopA 12s cubic-bezier(.4,0,.2,1) infinite}
.hopB{animation:hopB 12s cubic-bezier(.4,0,.2,1) infinite}
@keyframes pulse{0%,36%{transform:scale(1)}39%{transform:scale(1.15)}43%,100%{transform:scale(1)}}
.pulse{animation:pulse 12s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes type{0%,55%{transform:translateX(-120px);animation-timing-function:steps(12,end)}66%,94%{transform:translateX(0);animation-timing-function:steps(12,end)}100%{transform:translateX(-120px)}}
.type{animation:type 12s linear infinite}
@keyframes turn{0%{transform:translateY(20px);opacity:0}4%,25%{transform:translateY(0);opacity:1}29%,100%{transform:translateY(-20px);opacity:0}}
.turn{animation:turn 12s cubic-bezier(.4,0,.2,1) infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.flow{animation:flow 1.2s linear infinite}
</style>
<defs>
<clipPath id="typed"><rect x="696" y="220" width="124" height="26"/></clipPath>
<clipPath id="v1"><rect x="1004" y="276" width="196" height="44"/></clipPath>
<clipPath id="v2"><rect x="1004" y="344" width="196" height="44"/></clipPath>
</defs>
<rect width="1280" height="448" fill="$bg"/>
<g id="backdrop" data-backdrop="custom rise"><g transform="translate(640 600)"><circle class="ew" style="animation-delay:-0s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-2s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-4s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-6s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-8s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-10s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-12s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-14s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-16s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-18s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-20s" r="897" vector-effect="non-scaling-stroke"/><circle class="ew" style="animation-delay:-22s" r="897" vector-effect="non-scaling-stroke"/></g></g>
<text id="eyebrow" x="64" y="56" class="m" font-size="15" letter-spacing="2" fill="$accent">HOW YOU KNOW</text>
<text id="title" x="64" y="108" class="b" font-size="40" fill="$ink">Checked before, measured after you publish</text>
<text id="sub" x="64" y="146" class="s" font-size="20" fill="$body">A script checks every placement; later it repeats your searches.</text>
<g id="stage">
<!-- 1. the checks in the report -->
<rect x="64" y="176" width="344" height="256" rx="14" fill="$panel" stroke="$line" stroke-width="1.5"/>
<text x="88" y="208" class="m" font-size="14" fill="$muted">report · checks</text>
<text x="88" y="252" class="m" font-size="16" fill="$body">h1 · github readme banner</text>
<text x="88" y="296" class="m" font-size="16" fill="$body">lead · readme header</text>
<text x="88" y="340" class="m" font-size="16" fill="$body">alt · github readme banner</text>
<text x="88" y="384" class="m" font-size="16" fill="$body">body · svg banner</text>
<g class="tick" style="animation-delay:-12s"><g transform="translate(360 232)" data-asset="ph:check-fat-fill" data-icon="passed"><g transform="scale(0.109375)" color="$accent"><path fill="$accent" d="m243.31 90.91l-128.4 128.4a16 16 0 0 1-22.62 0l-71.62-72a16 16 0 0 1 0-22.61l20-20a16 16 0 0 1 22.58 0L104 144.22l96.76-95.57a16 16 0 0 1 22.59 0l19.95 19.54a16 16 0 0 1 .01 22.72"/></g></g></g>
<g class="tick" style="animation-delay:-11.3s"><g transform="translate(360 276)" data-asset="ph:check-fat-fill" data-icon="passed"><g transform="scale(0.109375)" color="$accent"><path fill="$accent" d="m243.31 90.91l-128.4 128.4a16 16 0 0 1-22.62 0l-71.62-72a16 16 0 0 1 0-22.61l20-20a16 16 0 0 1 22.58 0L104 144.22l96.76-95.57a16 16 0 0 1 22.59 0l19.95 19.54a16 16 0 0 1 .01 22.72"/></g></g></g>
<g class="tick" style="animation-delay:-10.6s"><g transform="translate(360 320)" data-asset="ph:check-fat-fill" data-icon="passed"><g transform="scale(0.109375)" color="$accent"><path fill="$accent" d="m243.31 90.91l-128.4 128.4a16 16 0 0 1-22.62 0l-71.62-72a16 16 0 0 1 0-22.61l20-20a16 16 0 0 1 22.58 0L104 144.22l96.76-95.57a16 16 0 0 1 22.59 0l19.95 19.54a16 16 0 0 1 .01 22.72"/></g></g></g>
<g class="tick" style="animation-delay:-9.9s"><g transform="translate(360 364)" data-asset="ph:check-fat-fill" data-icon="passed"><g transform="scale(0.109375)" color="$accent"><path fill="$accent" d="m243.31 90.91l-128.4 128.4a16 16 0 0 1-22.62 0l-71.62-72a16 16 0 0 1 0-22.61l20-20a16 16 0 0 1 22.58 0L104 144.22l96.76-95.57a16 16 0 0 1 22.59 0l19.95 19.54a16 16 0 0 1 .01 22.72"/></g></g></g>
<!-- 2. you publish -->
<path class="flow" d="M416 304H500" fill="none" stroke="$muted" stroke-width="2" stroke-dasharray="8 16"/>
<path d="M496 296l10 8-10 8" fill="none" stroke="$muted" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g class="pulse"><g transform="translate(528 236)" data-asset="ph:globe-fill" data-icon="published on the web"><g transform="scale(0.25)" color="$accent"><path fill="$accent" d="M128 24a104 104 0 1 0 104 104A104.12 104.12 0 0 0 128 24m78.36 64h-35.65a135.3 135.3 0 0 0-22.3-45.6A88.29 88.29 0 0 1 206.37 88Zm9.64 40a87.6 87.6 0 0 1-3.33 24h-38.51a157.4 157.4 0 0 0 0-48h38.51a87.6 87.6 0 0 1 3.33 24m-88-85a115.3 115.3 0 0 1 26 45h-52a115.1 115.1 0 0 1 26-45m-26 125h52a115.1 115.1 0 0 1-26 45a115.3 115.3 0 0 1-26-45m-3.9-16a140.8 140.8 0 0 1 0-48h59.88a140.8 140.8 0 0 1 0 48Zm50.35 61.6a135.3 135.3 0 0 0 22.3-45.6h35.66a88.29 88.29 0 0 1-58 45.6Z"/></g></g></g>
<text x="560" y="334" class="s" font-size="16" fill="$ink" text-anchor="middle">you publish</text>
<text x="560" y="358" class="s" font-size="15" fill="$muted" text-anchor="middle">weeks later</text>
<path class="flow" d="M612 304H644" fill="none" stroke="$muted" stroke-width="2" stroke-dasharray="8 16"/>
<!-- 3. the saved searches, repeated -->
<g data-kit="terminal"><rect x="652" y="176" width="564" height="256" rx="12" fill="$panel" stroke="$line" stroke-width="1.5"/><path d="M652 206H1216" stroke="$line" stroke-width="1.5"/><circle cx="672" cy="191" r="5" fill="$line"/><circle cx="688" cy="191" r="5" fill="$line"/><circle cx="704" cy="191" r="5" fill="$line"/></g>
<text x="676" y="240" class="m" font-size="16" fill="$accent">$</text>
<text x="696" y="240" class="m" font-size="16" fill="$ink">eco.py track</text>
<g clip-path="url(#typed)"><rect class="type" x="816" y="222" width="124" height="24" fill="$panel"/></g>
<text x="676" y="304" class="m" font-size="16" fill="$body">github readme banner</text>
<text x="676" y="372" class="m" font-size="16" fill="$body">readme header</text>
<g clip-path="url(#v1)">
<g class="turn" opacity="0" style="animation-delay:-12s"><rect x="1012" y="282" width="180" height="32" rx="16" fill="$lime"/><text x="1102" y="303" class="m" font-size="16" fill="$on_accent" text-anchor="middle">improved</text></g>
<g class="turn" opacity="0" style="animation-delay:-9s"><rect x="1012" y="282" width="180" height="31.6" rx="16" fill="$panel" stroke="$accent" stroke-width="1.5"/><text x="1102" y="303" class="m" font-size="16" fill="$accent" text-anchor="middle">no change</text></g>
<g class="turn" opacity="0" style="animation-delay:-6s"><rect x="1012" y="282" width="180" height="31.2" rx="16" fill="$panel" stroke="$muted" stroke-width="1.5"/><text x="1102" y="303" class="m" font-size="16" fill="$muted" text-anchor="middle">worse</text></g>
<g data-rest="shown"><g class="turn" style="animation-delay:-3s"><rect x="1012" y="282" width="180" height="30.8" rx="16" fill="$panel" stroke="$muted" stroke-width="1.5" stroke-dasharray="4 4"/><text x="1102" y="303" class="m" font-size="16" fill="$body" text-anchor="middle">too early to tell</text></g></g>
</g>
<g clip-path="url(#v2)">
<g class="turn" opacity="0" style="animation-delay:-6s"><rect x="1012" y="350" width="180" height="32" rx="16" fill="$lime"/><text x="1102" y="371" class="m" font-size="16" fill="$on_accent" text-anchor="middle">improved</text></g>
<g class="turn" opacity="0" style="animation-delay:-3s"><rect x="1012" y="350" width="180" height="31.6" rx="16" fill="$panel" stroke="$accent" stroke-width="1.5"/><text x="1102" y="371" class="m" font-size="16" fill="$accent" text-anchor="middle">no change</text></g>
<g class="turn" opacity="0" style="animation-delay:-12s"><rect x="1012" y="350" width="180" height="31.2" rx="16" fill="$panel" stroke="$muted" stroke-width="1.5"/><text x="1102" y="371" class="m" font-size="16" fill="$muted" text-anchor="middle">worse</text></g>
<g data-rest="shown"><g class="turn" style="animation-delay:-9s"><rect x="1012" y="350" width="180" height="30.8" rx="16" fill="$panel" stroke="$muted" stroke-width="1.5" stroke-dasharray="4 4"/><text x="1102" y="371" class="m" font-size="16" fill="$body" text-anchor="middle">too early to tell</text></g></g>
</g>
<!-- the parcels: the checked text goes public, then comes back to be measured -->
<g transform="translate(408 290)"><rect class="hopA" opacity="0" width="28" height="28" rx="7" fill="$lime"/></g>
<g transform="translate(560 290)"><rect class="hopB" opacity="0" width="28" height="28" rx="7" fill="$lime"/></g>
</g>
</svg>
